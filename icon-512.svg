<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#161526"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gradX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gradO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowX" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowO" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <!-- Glowing X -->
  <g filter="url(#glowX)">
    <line x1="120" y1="140" x2="260" y2="280" stroke="url(#gradX)" stroke-width="42" stroke-linecap="round"/>
    <line x1="260" y1="140" x2="120" y2="280" stroke="url(#gradX)" stroke-width="42" stroke-linecap="round"/>
  </g>
  <!-- Glowing O -->
  <g filter="url(#glowO)">
    <circle cx="340" cy="340" r="75" fill="none" stroke="url(#gradO)" stroke-width="38"/>
  </g>
  <!-- Star Sparkle -->
  <path d="M 256 90 Q 256 120 286 120 Q 256 120 256 150 Q 256 120 226 120 Q 256 120 256 90 Z" fill="#f59e0b"/>
</svg>